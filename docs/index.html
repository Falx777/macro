<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indicadores Macroeconômicos</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; margin: 0; }
    .meta { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    .controls { display: flex; align-items: center; gap: 8px; }
    select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.9rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .chart { width: 100%; height: 520px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Indicadores Macroeconômicos</h1>
      <div class="meta">Atualizado em: <span id="atualizacao">Carregando...</span></div>
    </div>
    <div class="controls">
      <label for="modo-global">Modo de visualização:</label>
      <select id="modo-global">
        <option value="linha" selected>Linha</option>
        <option value="coluna">Coluna</option>
      </select>
    </div>
  </header>

  <section class="card"><div id="g-ipca-comp" class="chart"></div></section>
  <section class="card"><div id="g-ipca-meta" class="chart"></div></section>
  <section class="card"><div id="g-selic" class="chart"></div></section>
  <section class="card"><div id="g-desemprego" class="chart"></div></section>

  <script src="app.js"></script>
</body>
</html>
